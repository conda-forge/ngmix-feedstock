{% set name = "ngmix-split" %}
{% set version = "2.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/esheldon/ngmix/archive/v{{ version }}.tar.gz
  sha256: 2ad9fc4bfc7a1800f3aa1f841f3e6e256b5e0ab8376fcd0dbd44ee62f37f54e4

build:
  number: 1
  skip: true  # [win]

outputs:
  - name: ngmix-core
    script: build_core.sh
    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
      host:
        - python
        - pip
        - setuptools
      run:
        - python
        - numpy
        - numba <0.41.0a|>=0.43.0,!=0.54.0  # bug in these numbas
        - scipy
        - galsim

    test:
      imports:
        - ngmix

  - name: ngmix
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("ngmix-core", exact=True) }}
        - meds
    test:
      imports:
        - ngmix
        - ngmix.medsreaders

about:
  home: https://github.com/esheldon/ngmix
  license: GPL-2.0-only
  license_family: GPL
  license_file: gpl.txt
  summary: Gaussian mixtures and image processing implemented in python and numba

extra:
  recipe-maintainers:
    - beckermr
